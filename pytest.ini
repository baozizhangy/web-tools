[pytest]
# pytest配置文件

# 测试文件和目录
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# 输出选项
addopts = 
    -v
    --tb=short
    --strict-markers
    --disable-warnings
    -ra
    --alluredir=tests/reports/allure_results

# 日志配置
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

log_file = tests/logs/pytest.log
log_file_level = DEBUG
log_file_format = %(asctime)s [%(levelname)8s] %(filename)s:%(lineno)d - %(message)s
log_file_date_format = %Y-%m-%d %H:%M:%S

# 标记定义
markers =
    smoke: 冒烟测试
    regression: 回归测试
    interface: 接口测试
    user: 用户相关接口
    credit: 授信相关接口
    card: 绑卡相关接口
    draw: 借款相关接口
    repay: 还款相关接口
    privilege: 权益相关接口
